[project]
name = "app"
version = "0.1.28"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi<1.0.0,>=0.114.2",
    "uvicorn>=0.48.0,<1.0.0",
    "python-multipart>=0.0.27,<1.0.0",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "tenacity>=8.2.3,<10.0.0",
    "pydantic>=2.13.4",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.0,<4.0.0",
    "sqlmodel>=0.0.38,<1.0.0",
    # Keep explicit because password hashing uses bcrypt directly.
    "bcrypt==5.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=2.60.0,<3.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "tavily-python>=0.7.24",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit<4.0.0,>=3.6.2",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that require external API access (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    # Third-party library warnings that cannot be fixed in this project
    "ignore:Please use `import python_multipart`:PendingDeprecationWarning:starlette",
]
