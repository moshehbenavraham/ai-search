name: Lint Backend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.4"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev
        working-directory: backend
      - run: uv run --no-sync bash scripts/lint.sh
        working-directory: backend
