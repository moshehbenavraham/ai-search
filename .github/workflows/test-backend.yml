name: Test Backend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.4"
          enable-cache: true
      - name: Prepare environment
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
      - name: Install dependencies
        run: uv sync --locked --group dev
        working-directory: backend
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db mailcatcher
      - name: Migrate DB
        run: uv run --no-sync bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run --no-sync bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans
        if: always()
      - name: Store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run --no-sync coverage report --fail-under=80
        working-directory: backend
